[project]
name = "cplayout-local-ml-companion"
version = "0.1.0"
description = "WSL-local advisory layout recommendation file bridge for CPLayout."
requires-python = ">=3.12"
dependencies = [
  "dvc>=3.60",
  "mlflow>=3.0",
  "numpy",
  "opencv-python-headless>=4.10",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
gis = [
  "geopandas",
  "rasterio",
  "rioxarray",
]
vision = [
  "matplotlib",
  "plotly",
  "scikit-image",
]
dashboard = [
  "dash",
  "streamlit",
]
api = [
  "fastapi",
  "httpx",
  "sqlalchemy",
  "uvicorn",
]
all = [
  "dash",
  "fastapi",
  "geopandas",
  "matplotlib",
  "plotly",
  "rasterio",
  "rioxarray",
  "scikit-image",
  "sqlalchemy",
  "streamlit",
  "httpx",
  "uvicorn",
]

[project.scripts]
cplayout-ml = "cplayout_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cplayout_ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
